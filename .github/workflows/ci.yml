name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit & runtime tests
        run: python -m unittest discover tests/ -v
      - name: Minimal "hello" example
        run: |
          python -m codac examples/hello.co --out-dir /tmp/ci &&
          cc -std=c89 -Wall -Wextra -Werror -I/tmp/ci \
             -o /tmp/hello_ci /tmp/ci/hello.c &&
          /tmp/hello_ci
      - name: End-to-end example
        run: |
          python -m codac examples/shapes_main.co --out-dir /tmp/ci &&
          cc -std=c89 -Wall -Wextra -Werror -I/tmp/ci \
             -o /tmp/shapes_ci /tmp/ci/shapes_main.c /tmp/ci/shapes.c &&
          /tmp/shapes_ci
      - name: Call from C example
        run: |
          python -m codac examples/shapes.co --out-dir /tmp/ci &&
          cc -std=c89 -Wall -Wextra -Werror -I/tmp/ci \
             -o /tmp/shapes_ci /tmp/ci/shapes.c examples/shapes_c.c &&
          /tmp/shapes_ci
      - name: Templates example
        run: |
          python -m codac examples/ring.co --out-dir /tmp/ci &&
          cc -std=c89 -Wall -Wextra -Werror -I/tmp/ci \
             -o /tmp/ring_ci /tmp/ci/ring.c &&
          /tmp/ring_ci
