name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Unit & runtime tests
        run: python -m unittest discover tests/ -v
      - name: End-to-end example
        run: |
          python -m codac examples/shapes.cod --out-dir /tmp/ci &&
          cc -std=c89 -Wall -Wextra -Werror -I/tmp/ci \
             -o /tmp/shapes_ci /tmp/ci/shapes.c examples/shapes_main.c &&
          /tmp/shapes_ci
